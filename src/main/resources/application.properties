spring.application.name=LDDAgent
spring.config.import=optional:classpath:application-local.properties

# Redis
spring.data.redis.host=192.168.0.210
spring.data.redis.port=6379
spring.data.redis.password=

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/qihang?useSSL=false&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# OpenAI-compatible model endpoint. MODEL_NAME is required.
app.model.base-url=${MODEL_BASE_URL:https://api.openai.com/v1}
app.model.api-key=${MODEL_API_KEY:${OPENAI_API_KEY:}}
app.model.name=${MODEL_NAME:}
app.model.chat-path=${MODEL_CHAT_PATH:/chat/completions}

# Cursor Cloud Agent API (the key stays server-side; never put it in the page)
app.cursor.base-url=${CURSOR_BASE_URL:https://api.cursor.com}
app.cursor.api-key=${CURSOR_API_KEY:}
app.cursor.repo-url=${CURSOR_REPO_URL:}
app.cursor.starting-ref=${CURSOR_STARTING_REF:main}
app.cursor.model-id=${CURSOR_MODEL_ID:}
app.cursor.auto-create-pr=${CURSOR_AUTO_CREATE_PR:true}
